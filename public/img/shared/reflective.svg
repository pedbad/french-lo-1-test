<?xml version="1.0" encoding="UTF-8"?>
<svg id="french-self-test-exercises" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">French self-test exercises</title>
  <desc id="desc">A hand-drawn French practice image showing an open workbook, headphones, speech bubbles, pronunciation cards, sound waves, gap-fill blanks and check marks in cream, blue, tan and black.</desc>
  <defs>
    <style>
      .ink{fill:none;stroke:#010202;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;}
      .ink2{fill:none;stroke:#010202;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;}
      .ink3{fill:none;stroke:#010202;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;}
      .navy{stroke:#1f3674;}
      .blueStroke{stroke:#618db2;}
      .skyStroke{stroke:#94cce6;}
      .tanStroke{stroke:#e7b97d;}
      .cream{fill:#fcecc4;}
      .pale{fill:#fef5d7;}
      .paper{fill:#fefdf7;}
      .sky{fill:#94cce6;}
      .blue{fill:#7ba9c7;}
      .deep{fill:#1f3674;}
      .tan{fill:#e7b97d;}
      .peach{fill:#fac6a5;}
      .softBlue{fill:#c9e5f1;}
      .shadowBlue{fill:#618db2;opacity:.32;}
      .ghost{fill:#dce7ee;opacity:.62;}
      .softTan{fill:#f8dda8;}
      .white{fill:#fffffe;}
      .black{fill:#010202;}
      .dot{fill:#010202;}
      .tiny{font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",cursive;font-size:24px;font-weight:700;letter-spacing:.4px;fill:#010202;}
      .label{font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",cursive;font-size:31px;font-weight:700;fill:#010202;}
      .smallLabel{font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",cursive;font-size:22px;font-weight:700;fill:#010202;}
      .accentText{font-family:Georgia,"Times New Roman",serif;font-size:104px;font-weight:700;fill:#010202;}
      .accentTextBlue{font-family:Georgia,"Times New Roman",serif;font-size:112px;font-weight:700;fill:#1f3674;}
      .exerciseText{font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",cursive;font-size:29px;font-weight:700;fill:#010202;}
      .faintWord{font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",cursive;font-size:20px;font-weight:700;fill:#010202;opacity:.25;}
    </style>
    <filter id="roughen" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.55" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="5" dy="7" result="offsetBlur"/>
      <feFlood flood-color="#010202" flood-opacity="0.22" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#010202"/>
    </marker>
    <linearGradient id="pageCream" x1="175" y1="552" x2="517" y2="875" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset=".48" stop-color="#fef5d7"/>
      <stop offset="1" stop-color="#f8dda8"/>
    </linearGradient>
    <linearGradient id="pageBlue" x1="848" y1="552" x2="502" y2="874" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset=".55" stop-color="#fef5d7"/>
      <stop offset="1" stop-color="#c9e5f1"/>
    </linearGradient>
  </defs>

