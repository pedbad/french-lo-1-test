    <path class="ink2" opacity=".13" d="M591 815c98-36 206-45 307-29"/>
    <path class="ink3" opacity=".12" d="M167 418c-31 8-51 24-62 48"/>
    <path class="ink3" opacity=".15" d="M832 173c39 19 62 45 71 79"/>
